spring.application.name=JanConnect

# =============================================
# SERVER
# =============================================
server.port=8081

# =============================================
# DATABASE
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/janconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Gokul@2008}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
jwt.secret=${JWT_SECRET:janconnect-super-secret-key-for-jwt-2026-hackathon-build-must-be-at-least-256-bits-long}
jwt.expiration=86400000

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# =============================================
# AI
# =============================================
ai.api.key=${AI_API_KEY:}

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================
# LOGGING
# =============================================
logging.level.com.janconnect=INFO
logging.level.org.springframework.security=WARN
